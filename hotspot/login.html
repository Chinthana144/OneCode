	<div id="div_login">
		<div id="div_logo">
			<img src="img/logo.png" alt="" id="img_logo">
		</div>
	
		<div id="div_camp_name">
			<h3>Camp Name</h3>
		</div>

		<div id="div_togglers">
			<button class="btn_toggler" id="btn_customer">Customer</button>
			<button class="btn_toggler" id="btn_voucher">Voucher</button>
		</div>

		<div id="div_customer_login">
			<form id="loginForm">
				<!-- testing mac and ip inputs -->
				<input type="hidden" name="mac" id="mac" value="CC:23:D3:46:AA:11">
				<input type="hidden" name="ip" id="ip" value="172.16.1.33">
				
				<!-- original mac and ip inputs -->
				<!-- <input type="hidden" name="mac" id="mac" value="$(mac)"> -->

				<input type="hidden" name="link-login" id="link-login" value="$(link-login)">
				<input type="hidden" name="link-orig" id="link-orig" value="$(link-orig)">
				<input type="hidden" name="error" value="$(error)">
				<!-- camp_id for each camp, cloud registered ID  -->
				<input type="hidden" name="camp_id" id="camp_id" value="1">

				<div id="inputSection">
					<label for="">Username(phone no)</label>
					<input class="txt_input" type="text" id="username" placeholder="Username" required />
					<br>
					<label for="">Password</label>
					<input class="txt_input" type="password" id="password" placeholder="Password" required />
				</div>


				<div id="div_qr_section" style="display:none;">
					<div id="qrcode"></div>
				</div>

				<button type="submit" class="btn_submit" id="btn_customer_login">Login</button>

				<button type="button" class="btn_submit" id="btn_qr_generator">Generate QR</button>

			</form>

			
		</div>

		<div id="div_voucher_login">
			<p>Voucher Login</p>
		</div>
